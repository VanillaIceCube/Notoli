<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}Notoli connection{% endblock %}</title>
  <style>
    body { margin: 0; background: #f5f4f0; color: #232722; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 480px; margin: 6vh auto; padding: 32px; background: white; border: 1px solid #dedfd8; border-radius: 16px; }
    h1 { font-size: 26px; line-height: 1.25; } a { color: #296d42; }
    label { display: block; margin-top: 16px; } input:not([type=hidden]) { box-sizing: border-box; width: 100%; padding: 12px; font: inherit; border: 1px solid #969c92; border-radius: 6px; }
    button { margin-top: 20px; padding: 12px 20px; font: inherit; border: 1px solid #296d42; background: #296d42; color: white; border-radius: 6px; cursor: pointer; }
    button.secondary { background: white; color: #296d42; } .errorlist, .error { color: #a02922; } .brand { font-weight: 700; letter-spacing: .08em; }
    @media (max-width: 560px) { main { margin: 20px; padding: 24px; } }
  </style>
</head>
<body><main><div class="brand">NOTOLI</div>{% block content %}{% endblock %}</main></body>
</html>
