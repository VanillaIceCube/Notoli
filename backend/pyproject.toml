[project]
name = "notoli-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django==6.1.3",
    "django-cors-headers==4.9.0",
    "django-filter==26.2",
    "djangorestframework==3.18.3",
    "djangorestframework-simplejwt==5.5.1",
    "gunicorn==26.2.0",
    "python-dotenv==1.2.4",
    "whitenoise==6.12.0",
    "django-oauth-toolkit==3.4.1",
    "mcp==2.3.0",
    "httpx2==2.16.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "PyYAML==6.0.3",
    "ruff==0.17.5",
]

[tool.uv]
package = false
