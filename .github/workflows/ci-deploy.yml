name: Deploy
on:
  push:
    branches: [env-prod]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: notoli-production-deploy
  cancel-in-progress: false
jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/env-prod'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify shared release standard
        run: python3 deploy/production/build_bundle.py --check-parity
      - name: Validate deployment destination
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
        shell: node {0}
        run: |
          const { env } = process;
          for (const key of ['DEPLOY_PATH', 'DEPLOY_HOST', 'DEPLOY_USER', 'DEPLOY_SSH_KEY', 'DEPLOY_HOST_FINGERPRINT']) {
            if (!env[key]) throw new Error('Missing deployment setting: ' + key);
          }
          const directory = env.DEPLOY_PATH;
          if (!directory.startsWith('/') || /[^A-Za-z0-9_/-]/.test(directory) || directory.split('/').includes('..') || directory === '/') {
            throw new Error('Invalid application directory');
          }
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: images
        shell: node {0}
        run: |
          const registry = 'ghcr.io/' + process.env.GITHUB_REPOSITORY_OWNER.toLowerCase();
          require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT,
            'backend=' + registry + '/notoli-backend\nfrontend=' + registry + '/notoli-frontend\n');
      - name: Build backend
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.backend }}:sha-${{ github.sha }}
      - name: Build frontend
        id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./frontend
          file: ./frontend/docker/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=
          tags: ${{ steps.images.outputs.frontend }}:sha-${{ github.sha }}
      - name: Create immutable app-only bundle
        id: bundle
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}@${{ steps.backend.outputs.digest }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}@${{ steps.frontend.outputs.digest }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_EMAIL_BACKEND: ${{ vars.DJANGO_EMAIL_BACKEND }}
          DJANGO_EMAIL_HOST: ${{ vars.DJANGO_EMAIL_HOST }}
          DJANGO_EMAIL_PORT: ${{ vars.DJANGO_EMAIL_PORT }}
          DJANGO_EMAIL_USE_TLS: ${{ vars.DJANGO_EMAIL_USE_TLS }}
          DJANGO_EMAIL_HOST_USER: ${{ vars.DJANGO_EMAIL_HOST_USER }}
          DJANGO_EMAIL_HOST_KEY: ${{ secrets.DJANGO_EMAIL_HOST_KEY }}
          DJANGO_EMAIL_TIMEOUT: ${{ vars.DJANGO_EMAIL_TIMEOUT }}
          DJANGO_DEFAULT_FROM_EMAIL: ${{ vars.DJANGO_DEFAULT_FROM_EMAIL }}
        shell: node {0}
        run: |
          process.umask(0o077);
          const id = require('node:child_process').execFileSync('python3', ['deploy/production/build_bundle.py', 'release_bundle'],
            { encoding: 'utf8' }).trimEnd();
          require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'release_id=' + id + '\n');
      - name: Reserve private incoming directory
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RELEASE_ID: ${{ steps.bundle.outputs.release_id }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          port: ${{ vars.DEPLOY_PORT || '22' }}
          envs: DEPLOY_PATH,RELEASE_ID
          script: |
            set -eu
            umask 077
            # Parent directories/permissions and stable locks are operator-provisioned.
            test -d "$DEPLOY_PATH/incoming"
            test ! -L "$DEPLOY_PATH"
            test ! -L "$DEPLOY_PATH/incoming"
            mkdir "$DEPLOY_PATH/incoming/$RELEASE_ID"
      - name: Upload into reserved attempt
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          port: ${{ vars.DEPLOY_PORT || '22' }}
          source: release_bundle/*
          target: ${{ vars.DEPLOY_PATH }}/incoming/${{ steps.bundle.outputs.release_id }}
          strip_components: 2
      - name: Activate only notoli
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RELEASE_ID: ${{ steps.bundle.outputs.release_id }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          port: ${{ vars.DEPLOY_PORT || '22' }}
          envs: DEPLOY_PATH,RELEASE_ID
          command_timeout: 15m
          script: |
            set -eu
            python3 "$DEPLOY_PATH/incoming/$RELEASE_ID/release.py" deploy \
              --root "$DEPLOY_PATH" --bundle "$DEPLOY_PATH/incoming/$RELEASE_ID"
