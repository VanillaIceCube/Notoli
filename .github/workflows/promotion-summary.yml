name: Production promotion summary

on:
  workflow_run:
    workflows: [Promotion summary request]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: promotion-summary-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  summary:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'pull_request' ||
        (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'env-prod'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed default-branch summary code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Maintain current promotion summaries
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/actions/promotion-summary/summary.js`);
            try {
              // Refresh every open promotion so coalesced pending events cannot
              // leave another PR's summary stale. Never execute a PR checkout.
              const { data: pulls } = await github.rest.pulls.list({ ...context.repo,
                state: 'open', base: 'env-prod', per_page: 11 });
              if (pulls.length > 10) throw new Error('Promotion inventory exceeds the bounded refresh limit.');
              for (const pull of pulls) {
                await run({ github, context, core, number: pull.number });
              }
            } catch (error) {
              const status = Number.isInteger(error.status) ? error.status : 'unknown';
              core.warning(`Promotion summary unavailable or uncertain (HTTP ${status}); no release/check authorization changed.`);
              core.setFailed('Informational promotion summary could not be verified. Inspect permissions or rerun after the comparison stabilizes.');
            }
