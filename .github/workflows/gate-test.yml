name: Test Gate

on:
  workflow_call:
    outputs:
      test_frontend_status:
        description: Frontend test status (success/failure/not-applicable).
        value: ${{ jobs.test-results.outputs.frontend_status }}
      test_frontend_log:
        description: Frontend test log tail.
        value: ${{ jobs.test-results.outputs.frontend_log }}
      test_backend_status:
        description: Backend test status (success/failure/not-applicable).
        value: ${{ jobs.test-results.outputs.backend_status }}
      test_backend_log:
        description: Backend test log tail.
        value: ${{ jobs.test-results.outputs.backend_log }}
      test_automation_status:
        description: Repository automation test status (success/failure/not-applicable).
        value: ${{ jobs.test-results.outputs.automation_status }}
      test_automation_log:
        description: Repository automation test log tail.
        value: ${{ jobs.test-results.outputs.automation_log }}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      automation: ${{ steps.filter.outputs.automation }}
      development: ${{ steps.filter.outputs.development }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: filter
        continue-on-error: true
        uses: dorny/paths-filter@f3360c560367c9daf72b88c0e6164162034c5721 # v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/actions/read-versions/**'
              - '.github/actions/setup-uv/**'
            backend:
              - 'backend/**'
              - 'backend/apps/mcp/framework/source.json'
              - '.github/workflows/gate-test.yml'
              - '.github/actions/read-versions/**'
              - '.github/actions/setup-uv/**'
            development:
              - 'backend/docker/Dockerfile.dev'
              - 'backend/docker/Dockerfile.dockerignore'
              - 'backend/docker/Dockerfile.dev.dockerignore'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - 'frontend/docker/Dockerfile.dev'
              - 'frontend/docker/Dockerfile.dockerignore'
              - 'frontend/docker/Dockerfile.dev.dockerignore'
              - 'frontend/package*.json'
              - '.github/workflows/gate-test.yml'
            automation:
              - 'docs/**'
              - 'README.md'
              - 'CHANGELOG.md'
              - 'AGENTS.md'
              - 'LICENSE.md'
              - '.github/**'
              - '.github/actions/dependabot-auto-merge/**'
              - '.github/actions/check-codeql-pins/**'
              - '.github/workflows/ci-auto-merge.yml'
              - '.github/actions/review-npm-malware/**'
              - '.github/actions/collect-codeql-evidence/**'
              - 'deploy/**'
              - '.github/workflows/ci-deploy.yml'
              - '.github/actions/collect-prior-ai-reviews/**'
              - '.github/actions/collect-upstream-major-upgrade-evidence/**'
              - '.github/actions/openai-chat/**'
              - '.github/actions/get-pr-diff/**'
              - '.github/workflows/ci-orchestrator.yml'
              - '.github/actions/publish-ai-review/**'
              - '.github/actions/security-alerts/**'
              - '.github/actions/prepare-vulnerability-report/**'
              - '.github/workflows/gate-vulnerability.yml'
              - '.github/workflows/gate-test.yml'
              - '.github/workflows/review-build.yml'
              - '.github/workflows/review-code.yml'
              - '.github/workflows/review-security.yml'

      - name: Report path detection failure
        if: steps.filter.outcome == 'failure'
        shell: bash
        run: |
          message="GitHub API path detection failed, so test scope was not evaluated. Rerun the workflow after the API limit or service error clears."
          echo "::error title=Test path detection unavailable::$message"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Test path detection unavailable"
              echo
              echo "$message"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1

  frontend-tests:
    name: Frontend Tests (React)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read versions
        id: versions
        uses: ./.github/actions/read-versions
        with:
          read_python: "false"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.versions.outputs.node_version }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        id: test_run
        continue-on-error: true
        env:
          CI: true
        run: |
          set -o pipefail
          status=0
          npm test -- --maxWorkers=2 2>&1 | tee test_output.txt || status=$?
          if [ "$status" = "0" ]; then
            npm run build 2>&1 | tee -a test_output.txt || status=$?
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Test summary
        id: test_summary
        if: always()
        run: |
          exit_code="${{ steps.test_run.outputs.exit_code }}"
          if [ -z "$exit_code" ]; then
            exit_code=1
          fi
          if [ "$exit_code" = "0" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

          python3 ../.github/tools/bounded_log.py test_output.txt "$GITHUB_OUTPUT"

      - name: Retain bounded failure diagnostics
        if: always() && steps.test_summary.outputs.status != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: failure-diagnostics-${{ github.job }}
          path: '**/*_output.bounded.txt'
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if tests failed
        if: steps.test_run.outputs.exit_code != '0'
        run: exit 1
    outputs:
      status: ${{ steps.test_summary.outputs.status }}
      log: ${{ steps.test_summary.outputs.log }}

  backend-tests:
    name: Backend Tests (Django)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Synchronize locked backend dependencies
        uses: ./.github/actions/setup-uv

      - name: Run backend tests
        id: test_run
        continue-on-error: true
        run: |
          set -o pipefail
          status=0
          { uv run --locked python -m unittest discover -s apps/mcp/chatgpt -p 'test_*.py' && uv run --locked python manage.py test --verbosity=2; } 2>&1 | tee test_output.txt || status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Test summary
        id: test_summary
        if: always()
        run: |
          exit_code="${{ steps.test_run.outputs.exit_code }}"
          if [ -z "$exit_code" ]; then
            exit_code=1
          fi
          if [ "$exit_code" = "0" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

          python3 ../.github/tools/bounded_log.py test_output.txt "$GITHUB_OUTPUT"

      - name: Retain bounded failure diagnostics
        if: always() && steps.test_summary.outputs.status != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: failure-diagnostics-${{ github.job }}
          path: '**/*_output.bounded.txt'
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if tests failed
        if: steps.test_run.outputs.exit_code != '0'
        run: exit 1
    outputs:
      status: ${{ steps.test_summary.outputs.status }}
      log: ${{ steps.test_summary.outputs.log }}

  automation-tests:
    name: Automation Tests (Node)
    needs: changes
    if: needs.changes.outputs.automation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Read versions
        id: versions
        uses: ./.github/actions/read-versions
        with:
          read_python: "false"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.versions.outputs.node_version }}

      - name: Synchronize locked repository dependencies
        uses: ./.github/actions/setup-uv

      - name: Install verified workflow validator
        run: bash .github/tools/install_actionlint.sh

      - name: Run repository automation tests
        id: test_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          status=0
          node --test .github/actions/custom-regressions/*.test.js .github/actions/promotion-summary/*.test.js .github/actions/collect-prior-ai-reviews/*.test.js .github/actions/check-workflow-security/*.test.js .github/actions/review-npm-malware/*.test.js .github/actions/dependabot-auto-merge/*.test.js .github/actions/check-codeql-pins/*.test.js .github/actions/collect-codeql-evidence/collect-codeql-evidence.test.js \
            .github/actions/review-npm-malware/review-npm-malware.test.js \
            .github/actions/collect-prior-ai-reviews/collect-prior-ai-reviews.test.js \
            .github/actions/collect-upstream-major-upgrade-evidence/*.test.js \
            .github/actions/publish-ai-review/publish-ai-review.test.js \
            .github/actions/publish-ai-review/review-gating.test.js \
            .github/actions/security-alerts/sync-security-alerts.test.js \
            .github/actions/prepare-vulnerability-report/prepare-vulnerability-report.test.js \
            2>&1 | tee automation_test_output.txt || status=$?
          python3 .github/tools/validate_repository.py \
            2>&1 | tee -a automation_test_output.txt || status=$?
          python3 deploy/check_parity.py \
            2>&1 | tee -a automation_test_output.txt || status=$?
          python3 -m unittest discover -s deploy/tests -v \
            2>&1 | tee -a automation_test_output.txt || status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Test summary
        id: test_summary
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.test_run.outputs.exit_code }}"
          if [ -z "$exit_code" ]; then
            exit_code=1
          fi
          if [ "$exit_code" = "0" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

          python3 .github/tools/bounded_log.py automation_test_output.txt "$GITHUB_OUTPUT"

      - name: Retain bounded failure diagnostics
        if: always() && steps.test_summary.outputs.status != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: failure-diagnostics-${{ github.job }}
          path: '**/*_output.bounded.txt'
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if tests failed
        if: steps.test_run.outputs.exit_code != '0'
        run: exit 1
    outputs:
      status: ${{ steps.test_summary.outputs.status }}
      log: ${{ steps.test_summary.outputs.log }}

  development-images:
    name: Development image builds
    needs: changes
    if: needs.changes.outputs.development == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build reviewed development images
        run: |
          docker build --file backend/docker/Dockerfile.dev --tag batch2-backend-dev backend
          docker build --file frontend/docker/Dockerfile.dev --tag batch2-frontend-dev frontend

  test-results:
    name: Test Results
    if: always()
    needs: [changes, frontend-tests, backend-tests, automation-tests, development-images]
    runs-on: ubuntu-latest
    outputs:
      frontend_status: ${{ steps.results.outputs.frontend_status }}
      frontend_log: ${{ steps.results.outputs.frontend_log }}
      backend_status: ${{ steps.results.outputs.backend_status }}
      backend_log: ${{ steps.results.outputs.backend_log }}
      automation_status: ${{ steps.results.outputs.automation_status }}
      automation_log: ${{ steps.results.outputs.automation_log }}
    steps:
      - name: Require scope detection
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Require applicable development image validation
        if: needs.changes.outputs.development == 'true' && needs.development-images.result != 'success'
        run: exit 1
      - name: Normalize test results
        id: results
        env:
          FRONTEND_RELEVANT: ${{ needs.changes.outputs.frontend }}
          FRONTEND_STATUS: ${{ needs.frontend-tests.outputs.status }}
          FRONTEND_LOG: ${{ needs.frontend-tests.outputs.log }}
          BACKEND_RELEVANT: ${{ needs.changes.outputs.backend }}
          BACKEND_STATUS: ${{ needs.backend-tests.outputs.status }}
          BACKEND_LOG: ${{ needs.backend-tests.outputs.log }}
          AUTOMATION_RELEVANT: ${{ needs.changes.outputs.automation }}
          AUTOMATION_STATUS: ${{ needs.automation-tests.outputs.status }}
          AUTOMATION_LOG: ${{ needs.automation-tests.outputs.log }}
        shell: bash
        run: |
          if [ "$FRONTEND_RELEVANT" = "true" ]; then
            echo "frontend_status=${FRONTEND_STATUS:-failure}" >> "$GITHUB_OUTPUT"
            {
              delimiter="RESULT_$(uuidgen)"
              echo "frontend_log<<$delimiter"
              echo "$FRONTEND_LOG"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          else
            echo "frontend_status=not-applicable" >> "$GITHUB_OUTPUT"
            echo "frontend_log=No frontend-relevant changes." >> "$GITHUB_OUTPUT"
          fi

          if [ "$BACKEND_RELEVANT" = "true" ]; then
            echo "backend_status=${BACKEND_STATUS:-failure}" >> "$GITHUB_OUTPUT"
            {
              delimiter="RESULT_$(uuidgen)"
              echo "backend_log<<$delimiter"
              echo "$BACKEND_LOG"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          else
            echo "backend_status=not-applicable" >> "$GITHUB_OUTPUT"
            echo "backend_log=No backend-relevant changes." >> "$GITHUB_OUTPUT"
          fi

          if [ "$AUTOMATION_RELEVANT" = "true" ]; then
            echo "automation_status=${AUTOMATION_STATUS:-failure}" >> "$GITHUB_OUTPUT"
            {
              delimiter="RESULT_$(uuidgen)"
              echo "automation_log<<$delimiter"
              echo "$AUTOMATION_LOG"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          else
            echo "automation_status=not-applicable" >> "$GITHUB_OUTPUT"
            echo "automation_log=No repository-automation-relevant changes." >> "$GITHUB_OUTPUT"
          fi

          if [ "$FRONTEND_RELEVANT" = "true" ] && [ "${FRONTEND_STATUS:-failure}" != "success" ]; then
            exit 1
          fi
          if [ "$BACKEND_RELEVANT" = "true" ] && [ "${BACKEND_STATUS:-failure}" != "success" ]; then
            exit 1
          fi
          if [ "$AUTOMATION_RELEVANT" = "true" ] && [ "${AUTOMATION_STATUS:-failure}" != "success" ]; then
            exit 1
          fi
