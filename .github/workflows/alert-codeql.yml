name: CodeQL Alert

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      scan_only:
        description: Run only the full CodeQL scan
        type: boolean
        default: false

permissions: {}

jobs:
  scan:
    name: Full CodeQL scan
    if: github.event_name == 'schedule' || inputs.scan_only
    uses: VanillaIceCube/infrastructure/.github/workflows/alert-codeql.yml@88123d60db9743b50af6779f532a37c5f81ae4a0 # Infrastructure, 2026-11-27
    with:
      scan_only: true
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write

  aggregate:
    if: github.event_name == 'schedule' || !inputs.scan_only
    concurrency:
      group: security-alerts-codeql
      cancel-in-progress: false
    permissions:
      contents: read
    uses: VanillaIceCube/agent-hub/.github/workflows/triage-security.yml@1df9af3fc79df45fa938982b3692952af1db5ad8 # AgentHub, 2026-11-27
    with:
      feed: codeql
      publish: true
    secrets:
      ROBOCOP_PRIVATE_KEY: ${{ secrets.ROBOCOP_PRIVATE_KEY }}
      ROBOCOP_OPENAI_API_KEY: ${{ secrets.ROBOCOP_OPENAI_API_KEY }}
