name: CodeQL Alert

on:
  schedule:
    - cron: "10 11 * * *"
  workflow_dispatch:

jobs:
  aggregate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out workflow actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create RoboCop GitHub App token
        id: robocop-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.ROBOCOP_APP_ID }}
          private-key: ${{ secrets.ROBOCOP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-security-events: read

      - name: Aggregate CodeQL alerts
        uses: ./.github/actions/security-alerts
        with:
          feed: codeql
          robocop-token: ${{ steps.robocop-token.outputs.token }}
          project-token: ${{ secrets.SECURITY_ALERTS_TOKEN }}
          openai-api-key: ${{ secrets.ROBOCOP_OPENAI_API_KEY }}
          openai-project-id: ${{ vars.OPENAI_REVIEWERS_PROJECT_ID }}
          project-id: ${{ vars.SECURITY_ALERTS_PROJECT_ID }}
