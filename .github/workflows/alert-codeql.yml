name: CodeQL Alert

on:
  workflow_run:
    workflows: [CodeQL Gate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-alerts-codeql
  cancel-in-progress: false

jobs:
  aggregate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'schedule' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out workflow actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create RoboCop GitHub App token
        id: robocop-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.ROBOCOP_APP_ID }}
          private-key: ${{ secrets.ROBOCOP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-security-events: read

      - name: Aggregate CodeQL alerts
        uses: ./.github/actions/track-security-alerts
        with:
          feed: codeql
          model: ${{ vars.AI_REVIEW_MODEL || 'gpt-6-luna' }}
          reasoning-effort: ${{ vars.AI_REVIEW_REASONING_EFFORT || 'medium' }}
          max-output-tokens: ${{ vars.AI_REVIEW_MAX_OUTPUT_TOKENS || '16000' }}
          robocop-token: ${{ steps.robocop-token.outputs.token }}
          openai-api-key: ${{ secrets.ROBOCOP_OPENAI_API_KEY }}
          openai-project-id: ${{ vars.OPENAI_REVIEWERS_PROJECT_ID }}
