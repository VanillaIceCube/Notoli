name: CodeQL Alert

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      scan_only:
        description: Run only the full CodeQL scan
        type: boolean
        default: false

permissions: {}

jobs:
  scan:
    name: Full CodeQL scan
    if: github.event_name == 'schedule' || inputs.scan_only
    uses: VanillaIceCube/infrastructure/.github/workflows/alert-codeql.yml@main
    with:
      scan_only: true
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write

  aggregate:
    if: github.event_name == 'schedule' || !inputs.scan_only
    concurrency: security-alerts-codeql
    permissions:
      contents: read
    uses: VanillaIceCube/agent-hub/.github/workflows/triage-security.yml@main
    with:
      feed: codeql
      publish: true
    secrets:
      ROBOCOP_PRIVATE_KEY: ${{ secrets.ROBOCOP_PRIVATE_KEY }}
      ROBOCOP_OPENAI_API_KEY: ${{ secrets.ROBOCOP_OPENAI_API_KEY }}
