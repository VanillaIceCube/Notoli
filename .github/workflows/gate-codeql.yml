name: CodeQL Gate

on:
  workflow_call:
    outputs:
      scope_status:
        description: Whether path-aware CodeQL scope detection succeeded.
        value: ${{ jobs.changes.outputs.scope_status }}
      scope_python:
        description: Whether the pull request requires Python analysis.
        value: ${{ jobs.changes.outputs.python }}
      scope_javascript:
        description: Whether the pull request requires JavaScript/TypeScript analysis.
        value: ${{ jobs.changes.outputs.javascript }}
      scope_actions:
        description: Whether the pull request requires GitHub Actions analysis.
        value: ${{ jobs.changes.outputs.actions }}
  schedule:
    - cron: "0 0 * * *"
      timezone: America/Los_Angeles
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

jobs:
  changes:
    name: Detect CodeQL Scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scope_status: ${{ steps.scope.outputs.scope_status }}
      python: ${{ steps.scope.outputs.python }}
      javascript: ${{ steps.scope.outputs.javascript }}
      actions: ${{ steps.scope.outputs.actions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install locked workflow dependencies
        run: npm ci --prefix .github --ignore-scripts --no-audit --no-fund

      - name: Verify atomic immutable CodeQL revisions
        run: node .github/scripts/validate-workflows.js --check-codeql-pins

      - name: Detect relevant changes
        id: filter
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dorny/paths-filter@f3360c560367c9daf72b88c0e6164162034c5721 # v4
        with:
          filters: |
            python:
              - 'backend/**'
              - '**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/actions/**'
              - '.github/scripts/**'
              - '.github/tests/**'
              - '.github/fixtures/**'
              - '.github/package.json'
              - '.github/package-lock.json'
              - '.github/workflows/**'
              - '.github/codeql/**'
            javascript:
              - 'frontend/**'
              - '**/*.js'
              - '**/*.cjs'
              - '**/*.mjs'
              - '**/*.jsx'
              - '**/*.ts'
              - '**/*.cts'
              - '**/*.mts'
              - '**/*.tsx'
              - '.github/actions/**'
              - '.github/scripts/**'
              - '.github/tests/**'
              - '.github/fixtures/**'
              - '.github/package.json'
              - '.github/package-lock.json'
              - '.github/workflows/**'
              - '.github/codeql/**'
            actions:
              - '.github/actions/**'
              - '.github/scripts/**'
              - '.github/tests/**'
              - '.github/fixtures/**'
              - '.github/package.json'
              - '.github/package-lock.json'
              - '.github/workflows/**'
              - '.github/codeql/**'

      - name: Report path detection failure
        if: github.event_name == 'pull_request' && steps.filter.outcome != 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TITLE: CodeQL path detection unavailable
          MESSAGE: GitHub API path detection failed, so CodeQL scope was not evaluated. Rerun the workflow after the API limit or service error clears.
        with:
          script: |
            core.error(process.env.MESSAGE, { title: process.env.TITLE });
            await core.summary.addHeading(process.env.TITLE, 3).addRaw(process.env.MESSAGE).write();
            process.exitCode = 1;

      - name: Set analysis scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PYTHON_SCOPE: ${{ steps.filter.outputs.python }}
          JAVASCRIPT_SCOPE: ${{ steps.filter.outputs.javascript }}
          ACTIONS_SCOPE: ${{ steps.filter.outputs.actions }}
        run: node .github/scripts/set-codeql-scope.js

  analyze-python:
    name: Analyze Python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          # GitHub's security-and-quality suite includes security-extended: https://docs.github.com/en/code-security/concepts/code-scanning/codeql/codeql-query-suites
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:python"

  analyze-javascript:
    name: Analyze JavaScript/TypeScript
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"

  analyze-actions:
    name: Analyze GitHub Actions
    needs: changes
    if: needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: actions
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:actions"
