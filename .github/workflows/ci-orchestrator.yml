name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches-ignore:
      - env-prod

concurrency:
  group: continuous-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  lints:
    name: Lints
    uses: ./.github/workflows/gate-lint.yml
    secrets:
      LINT_EASTWOOD_PRIVATE_KEY: ${{ secrets.LINT_EASTWOOD_PRIVATE_KEY }}
    with:
      checkout_ref: ${{ github.event.pull_request.head.ref }}
      enable_autofix: >-
        ${{
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        }}

  tests:
    name: Tests
    uses: ./.github/workflows/gate-test.yml

  codeql:
    name: CodeQL
    uses: ./.github/workflows/gate-codeql.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write

  dependency-vulnerability:
    name: Vulnerability
    uses: ./.github/workflows/gate-vulnerability.yml
    permissions:
      contents: read
      pull-requests: write

  dependency-malware:
    name: Malware
    uses: ./.github/workflows/gate-malware.yml
    permissions:
      contents: read
      pull-requests: write

  code-review:
    name: AI Code Review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/review-code.yml
    secrets:
      OBI_WAN_OPENAI_API_KEY: ${{ secrets.OBI_WAN_OPENAI_API_KEY }}
      OBI_WAN_CODE_NOBI_PRIVATE_KEY: ${{ secrets.OBI_WAN_CODE_NOBI_PRIVATE_KEY }}

  build-review:
    name: AI Build Sheriff Review
    needs: [lints, tests]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/review-build.yml
    secrets:
      LINT_EASTWOOD_OPENAI_API_KEY: ${{ secrets.LINT_EASTWOOD_OPENAI_API_KEY }}
      LINT_EASTWOOD_PRIVATE_KEY: ${{ secrets.LINT_EASTWOOD_PRIVATE_KEY }}
    permissions:
      contents: read
      pull-requests: write
    with:
      lint_result: ${{ needs.lints.result }}
      test_result: ${{ needs.tests.result }}
      lint_frontend_status: ${{ needs.lints.outputs.lint_frontend_status }}
      lint_frontend_log: ${{ needs.lints.outputs.lint_frontend_log }}
      lint_backend_status: ${{ needs.lints.outputs.lint_backend_status }}
      lint_backend_log: ${{ needs.lints.outputs.lint_backend_log }}
      test_frontend_status: ${{ needs.tests.outputs.test_frontend_status }}
      test_frontend_log: ${{ needs.tests.outputs.test_frontend_log }}
      test_backend_status: ${{ needs.tests.outputs.test_backend_status }}
      test_backend_log: ${{ needs.tests.outputs.test_backend_log }}
      test_automation_status: ${{ needs.tests.outputs.test_automation_status }}
      test_automation_log: ${{ needs.tests.outputs.test_automation_log }}

  security-review:
    name: AI Security Review
    needs: [codeql, dependency-vulnerability, dependency-malware]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/review-security.yml
    secrets:
      ROBOCOP_OPENAI_API_KEY: ${{ secrets.ROBOCOP_OPENAI_API_KEY }}
      ROBOCOP_PRIVATE_KEY: ${{ secrets.ROBOCOP_PRIVATE_KEY }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
      security-events: read
    with:
      codeql_result: ${{ needs.codeql.result }}
      codeql_scope_status: ${{ needs.codeql.outputs.scope_status }}
      codeql_scope_python: ${{ needs.codeql.outputs.scope_python }}
      codeql_scope_javascript: ${{ needs.codeql.outputs.scope_javascript }}
      codeql_scope_actions: ${{ needs.codeql.outputs.scope_actions }}
      dependency_vulnerability_result: ${{ needs.dependency-vulnerability.result }}
      dependency_vulnerability_report: ${{ needs.dependency-vulnerability.outputs.vulnerability_report }}
      dependency_malware_result: ${{ needs.dependency-malware.result }}
      dependency_malware_report: ${{ needs.dependency-malware.outputs.malware_report }}

  auto-merge:
    name: Auto Merge
    needs: [lints, tests, codeql, dependency-vulnerability, dependency-malware, code-review, build-review, security-review]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify branch rules are readable with the workflow token
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // API 2026-03-10 requires Metadata: read for this endpoint:
            // https://docs.github.com/en/rest/repos/rules#get-rules-for-a-branch
            const rules = await github.paginate(github.rest.repos.getBranchRules, {
              ...context.repo, branch: 'main', per_page: 100,
              headers: { 'X-GitHub-Api-Version': '2026-03-10' },
            });
            if (!rules.some((rule) => rule.type === 'required_status_checks')) {
              throw new Error('Expected protected main-branch status rules.');
            }
            core.info('Live branch rules are readable with the read-only workflow token.');
            const schema = await github.graphql('query { __type(name: "EnablePullRequestAutoMergeInput") { inputFields { name } } }');
            if (!schema.__type.inputFields.some((field) => field.name === 'expectedHeadOid')) {
              throw new Error('GitHub auto-merge schema lacks the required atomic head guard.');
            }
            core.info('Live GitHub schema supports expectedHeadOid for native auto-merge.');

      - name: Report auto-merge status
        shell: bash
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          LINT_RESULT: ${{ needs.lints.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          VULNERABILITY_RESULT: ${{ needs.dependency-vulnerability.result }}
          MALWARE_RESULT: ${{ needs.dependency-malware.result }}
        run: |
          set -euo pipefail

          if [ "$PR_AUTHOR" != 'dependabot[bot]' ]; then
            echo 'Auto-merge is not applicable to this pull request.'
            exit 0
          fi

          if [ "$LINT_RESULT" = 'success' ] && \
             [ "$TEST_RESULT" = 'success' ] && \
             [ "$CODEQL_RESULT" = 'success' ] && \
             [ "$VULNERABILITY_RESULT" = 'success' ] && \
             [ "$MALWARE_RESULT" = 'success' ]; then
            echo 'Dependabot eligibility will be evaluated after successful CI by the main-branch follow-up.'
          else
            echo 'Dependabot auto-merge is not evaluated until all independent gates pass.'
          fi
