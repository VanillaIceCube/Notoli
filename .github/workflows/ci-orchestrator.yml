name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches-ignore:
      - env-prod

concurrency:
  group: continuous-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lints:
    name: Lints
    uses: VanillaIceCube/infrastructure/.github/workflows/gate-lint.yml@main
    permissions:
      contents: read
      pull-requests: read
    secrets:
      LINT_EASTWOOD_PRIVATE_KEY: ${{ secrets.LINT_EASTWOOD_PRIVATE_KEY }}
    with:
      application: true
      checkout_ref: ${{ github.event.pull_request.head.ref }}
      enable_autofix: >-
        ${{
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        }}

  tests:
    name: Tests
    uses: VanillaIceCube/infrastructure/.github/workflows/gate-test.yml@main
    with:
      application: true
    permissions:
      contents: read
      pull-requests: read

  codeql:
    name: CodeQL
    uses: VanillaIceCube/infrastructure/.github/workflows/alert-codeql.yml@main
    with:
      scan_only: true
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write

  dependency-vulnerability:
    name: Vulnerability
    uses: VanillaIceCube/infrastructure/.github/workflows/gate-vulnerability.yml@main
    permissions:
      contents: read
      pull-requests: read

  dependency-malware:
    name: Malware
    uses: VanillaIceCube/infrastructure/.github/workflows/gate-malware.yml@main
    permissions:
      contents: read
      pull-requests: read

  secrets:
    name: Secret scan
    uses: VanillaIceCube/infrastructure/.github/workflows/gate-secrets.yml@main

  code-review:
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    name: AI Code Review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    uses: VanillaIceCube/agent-hub/.github/workflows/review-code.yml@main
    with:
      publish: true
    secrets:
      OBI_WAN_OPENAI_API_KEY: ${{ secrets.OBI_WAN_OPENAI_API_KEY }}
      OBI_WAN_CODE_NOBI_PRIVATE_KEY: ${{ secrets.OBI_WAN_CODE_NOBI_PRIVATE_KEY }}

  build-review:
    name: AI Build Sheriff Review
    needs: [lints, tests]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: VanillaIceCube/agent-hub/.github/workflows/review-build.yml@main
    secrets:
      LINT_EASTWOOD_OPENAI_API_KEY: ${{ secrets.LINT_EASTWOOD_OPENAI_API_KEY }}
      LINT_EASTWOOD_PRIVATE_KEY: ${{ secrets.LINT_EASTWOOD_PRIVATE_KEY }}
    permissions:
      statuses: read
      checks: read
      contents: read
      pull-requests: read
    with:
      publish: true
      lint_result: ${{ needs.lints.result }}
      test_result: ${{ needs.tests.result }}
      lint_evidence: ${{ toJSON(needs.lints.outputs) }}
      test_evidence: ${{ toJSON(needs.tests.outputs) }}

  security-review:
    name: AI Security Review
    needs: [codeql, dependency-vulnerability, dependency-malware, secrets]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: VanillaIceCube/agent-hub/.github/workflows/review-security.yml@main
    secrets:
      ROBOCOP_OPENAI_API_KEY: ${{ secrets.ROBOCOP_OPENAI_API_KEY }}
      ROBOCOP_PRIVATE_KEY: ${{ secrets.ROBOCOP_PRIVATE_KEY }}
    permissions:
      statuses: read
      actions: read
      checks: read
      contents: read
      pull-requests: read
      security-events: read
    with:
      publish: true
      codeql_result: ${{ needs.codeql.result }}
      codeql_scope_status: ${{ needs.codeql.outputs.scope_status }}
      codeql_scope_python: ${{ needs.codeql.outputs.scope_python }}
      codeql_scope_javascript: ${{ needs.codeql.outputs.scope_javascript }}
      codeql_scope_actions: ${{ needs.codeql.outputs.scope_actions }}
      dependency_vulnerability_result: ${{ needs.dependency-vulnerability.result }}
      dependency_vulnerability_report: ${{ needs.dependency-vulnerability.outputs.vulnerability_report }}
      dependency_malware_result: ${{ needs.dependency-malware.result }}
      dependency_malware_report: ${{ needs.dependency-malware.outputs.malware_report }}
      secret_scan_result: ${{ needs.secrets.result }}

  branch-rules:
    needs: [lints, tests, codeql, dependency-vulnerability, dependency-malware, secrets, code-review, build-review, security-review]
    if: always()
    uses: VanillaIceCube/infrastructure/.github/workflows/gate-branch-rules.yml@main
    permissions:
      contents: read

  # Branch protection requires this exact check name.
  auto-merge:
    name: Auto Merge
    needs: branch-rules
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require branch rule verification
        env:
          RESULT: ${{ needs.branch-rules.result }}
        run: test "$RESULT" = success
