name: Promotion summary request

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [env-prod]
  push:
    branches: [env-prod]

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      # No checkout, artifacts, caches, secrets or write token. The separately
      # trusted default-branch consumer reads current GitHub metadata itself.
      - name: Signal a promotion metadata refresh
        run: echo "Promotion metadata refresh requested."
