name: Lint Gate

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Branch or ref to check out for auto-fix commits."
        required: false
        type: string
      enable_autofix:
        description: "Allow lint fixes to be committed and pushed for a trusted same-repository branch."
        required: false
        default: false
        type: boolean
    secrets:
      LINT_EASTWOOD_PRIVATE_KEY:
        required: false
    outputs:
      lint_frontend_status:
        description: Frontend lint status (success/failure/not-applicable).
        value: ${{ jobs.lint-results.outputs.frontend_status }}
      lint_frontend_log:
        description: Frontend lint log tail.
        value: ${{ jobs.lint-results.outputs.frontend_log }}
      lint_backend_status:
        description: Backend lint status (success/failure/not-applicable).
        value: ${{ jobs.lint-results.outputs.backend_status }}
      lint_backend_log:
        description: Backend lint log tail.
        value: ${{ jobs.lint-results.outputs.backend_log }}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0
          ref: ${{ inputs.enable_autofix && inputs.checkout_ref || '' }}

      - name: Detect relevant changes
        id: filter
        continue-on-error: true
        uses: dorny/paths-filter@f3360c560367c9daf72b88c0e6164162034c5721 # v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/actions/setup-lint-bot/**'
              - '.github/scripts/summarize-check-log.js'
              - '.github/scripts/run-app-checks.js'
              - '.github/scripts/detect-lint-fixes.js'
            backend:
              - 'backend/**'
              - '.github/actions/setup-uv/**'
              - '.github/actions/setup-lint-bot/**'
              - '.github/scripts/summarize-check-log.js'
              - '.github/scripts/run-app-checks.js'
              - '.github/scripts/detect-lint-fixes.js'

      - name: Report path detection failure
        if: steps.filter.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TITLE: Lint path detection unavailable
          MESSAGE: GitHub API path detection failed, so lint scope was not evaluated. Rerun the workflow after the API limit or service error clears.
        with:
          script: |
            core.error(process.env.MESSAGE, { title: process.env.TITLE });
            await core.summary.addHeading(process.env.TITLE, 3).addRaw(process.env.MESSAGE).write();
            process.exitCode = 1;

  lint-frontend:
    name: Lint Frontend (ESLint + Prettier)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: lint-commit-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.enable_autofix && inputs.checkout_ref || '' }}
          persist-credentials: false

      - name: Require a Node version in the frontend manifest
        run: jq -e '.engines.node | strings | test("\\S") and (test("[\r\n]") | not)' package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/package.json
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Prettier (auto-fix)
        if: inputs.enable_autofix
        run: npm run format

      - name: ESLint (auto-fix)
        if: inputs.enable_autofix
        run: npm run lint:fix

      - name: Detect changes
        id: git-changes
        env:
          AUTOFIX_ENABLED: ${{ inputs.enable_autofix }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/detect-lint-fixes.js"

      - name: Set up Lint Eastwood bot
        id: lint-eastwood-bot
        if: steps.git-changes.outputs.changed == 'true'
        uses: ./.github/actions/setup-lint-bot
        with:
          app_id: ${{ vars.LINT_EASTWOOD_APP_ID }}
          private_key: ${{ secrets.LINT_EASTWOOD_PRIVATE_KEY }}

      - name: Commit auto-fixes
        if: steps.git-changes.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          commit_message: "Github Actions: Prettier & ESLint automatic lint fixes"
          branch: ${{ inputs.checkout_ref || github.head_ref }}
          file_pattern: |
            frontend
          commit_user_name: "Lint Eastwood"
          commit_user_email: ${{ steps.lint-eastwood-bot.outputs.bot_email }}
          commit_author: "Lint Eastwood <${{ steps.lint-eastwood-bot.outputs.bot_email }}>"

      - name: Remove Lint Eastwood push credentials
        if: always() && steps.git-changes.outputs.changed == 'true'
        shell: bash
        run: git remote set-url --push origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Lint checks
        id: lint_checks
        continue-on-error: true
        shell: bash
        run: node "$GITHUB_WORKSPACE/.github/scripts/run-app-checks.js" lint-frontend 2>&1 | tee lint_output.txt

      - name: Lint summary
        id: lint_summary
        if: always()
        env:
          CHECK_EXIT_CODE: ${{ steps.lint_checks.outcome == 'success' && '0' || '1' }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/summarize-check-log.js" lint_output.txt --exit-code "$CHECK_EXIT_CODE" --tail-lines 200

      - name: Fail if lint failed
        if: steps.lint_checks.outcome != 'success'
        run: exit 1
    outputs:
      status: ${{ steps.lint_summary.outputs.status }}
      log: ${{ steps.lint_summary.outputs.log }}

  lint-backend:
    name: Lint Backend (Ruff)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: lint-commit-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.enable_autofix && inputs.checkout_ref || '' }}
          persist-credentials: false

      - name: Set up locked Python tooling
        uses: ./.github/actions/setup-uv
        with:
          only-dev: "true"

      - name: Ruff (auto-fix)
        if: inputs.enable_autofix
        run: uv run --locked --only-group dev ruff check . --fix

      - name: Ruff format (auto-fix)
        if: inputs.enable_autofix
        run: uv run --locked --only-group dev ruff format .

      - name: Detect changes
        id: git-changes
        env:
          AUTOFIX_ENABLED: ${{ inputs.enable_autofix }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/detect-lint-fixes.js"

      - name: Set up Lint Eastwood bot
        id: lint-eastwood-bot
        if: steps.git-changes.outputs.changed == 'true'
        uses: ./.github/actions/setup-lint-bot
        with:
          app_id: ${{ vars.LINT_EASTWOOD_APP_ID }}
          private_key: ${{ secrets.LINT_EASTWOOD_PRIVATE_KEY }}

      - name: Commit auto-fixes
        if: steps.git-changes.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          commit_message: "Github Actions: Ruff automatic lint fixes"
          branch: ${{ inputs.checkout_ref || github.head_ref }}
          file_pattern: |
            backend
          commit_user_name: "Lint Eastwood"
          commit_user_email: ${{ steps.lint-eastwood-bot.outputs.bot_email }}
          commit_author: "Lint Eastwood <${{ steps.lint-eastwood-bot.outputs.bot_email }}>"

      - name: Remove Lint Eastwood push credentials
        if: always() && steps.git-changes.outputs.changed == 'true'
        shell: bash
        run: git remote set-url --push origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Ruff checks
        id: lint_checks
        continue-on-error: true
        shell: bash
        run: node "$GITHUB_WORKSPACE/.github/scripts/run-app-checks.js" lint-backend 2>&1 | tee lint_output.txt

      - name: Lint summary
        id: lint_summary
        if: always()
        env:
          CHECK_EXIT_CODE: ${{ steps.lint_checks.outcome == 'success' && '0' || '1' }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/summarize-check-log.js" lint_output.txt --exit-code "$CHECK_EXIT_CODE" --tail-lines 200

      - name: Fail if lint failed
        if: steps.lint_checks.outcome != 'success'
        run: exit 1
    outputs:
      status: ${{ steps.lint_summary.outputs.status }}
      log: ${{ steps.lint_summary.outputs.log }}

  lint-results:
    name: Lint Results
    if: always()
    needs: [changes, lint-frontend, lint-backend]
    runs-on: ubuntu-latest
    outputs:
      frontend_status: >-
        ${{ needs.changes.outputs.frontend == 'false' && 'not-applicable' ||
            needs.changes.outputs.frontend == 'true' && needs.lint-frontend.outputs.status == 'success' && 'success' || 'failure' }}
      frontend_log: >-
        ${{ needs.changes.outputs.frontend == 'false' && 'No frontend-relevant changes.' ||
            needs.changes.outputs.frontend != 'true' && 'Unable to determine frontend scope.' ||
            needs.lint-frontend.outputs.log }}
      backend_status: >-
        ${{ needs.changes.outputs.backend == 'false' && 'not-applicable' ||
            needs.changes.outputs.backend == 'true' && needs.lint-backend.outputs.status == 'success' && 'success' || 'failure' }}
      backend_log: >-
        ${{ needs.changes.outputs.backend == 'false' && 'No backend-relevant changes.' ||
            needs.changes.outputs.backend != 'true' && 'Unable to determine backend scope.' ||
            needs.lint-backend.outputs.log }}
    steps:
      - name: Require applicable frontend lint result
        if: >-
          always() && needs.changes.outputs.frontend != 'false' &&
          (needs.changes.outputs.frontend != 'true' || needs.lint-frontend.outputs.status != 'success')
        run: exit 1
      - name: Require applicable backend lint result
        if: >-
          always() && needs.changes.outputs.backend != 'false' &&
          (needs.changes.outputs.backend != 'true' || needs.lint-backend.outputs.status != 'success')
        run: exit 1
