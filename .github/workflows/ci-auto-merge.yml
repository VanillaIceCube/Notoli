name: Dependabot Auto Merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  dependabot-auto-merge:
    uses: VanillaIceCube/infrastructure/.github/workflows/ci-auto-merge.yml@main
    permissions:
      actions: read
      checks: write
      contents: write
      pull-requests: write
      vulnerability-alerts: read
