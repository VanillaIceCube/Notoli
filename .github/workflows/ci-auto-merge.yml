name: Dependabot Auto Merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  dependabot-auto-merge:
    name: Dependabot Auto Merge
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      security-events: read
    steps:
      # Only reviewed main code is executable in this privileged follow-up.
      # Never check out a PR ref or consume a CI artifact/cache here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Resolve the successful CI head through GitHub
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { resolveRun } = require(`${process.env.GITHUB_WORKSPACE}/.github/actions/dependabot-auto-merge/enable-auto-merge.js`);
            const pr = await resolveRun({ github, context });
            core.setOutput('eligible', Boolean(pr));
            if (pr) {
              require('node:fs').writeFileSync(`${process.env.RUNNER_TEMP}/dependabot-pr-event.json`, JSON.stringify({ pull_request: pr }));
            } else {
              core.info('No current same-repository Dependabot PR for this CI run.');
            }

      - name: Fetch verified Dependabot metadata
        id: metadata
        if: steps.pr.outputs.eligible == 'true'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        env:
          # This payload comes from the API, never from a PR artifact.
          GITHUB_EVENT_PATH: ${{ runner.temp }}/dependabot-pr-event.json
        with:
          github-token: ${{ github.token }}
          alert-lookup: true

      - name: Enable protected-branch auto-merge
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ALERT_STATE: ${{ steps.metadata.outputs.alert-state }}
          CVSS: ${{ steps.metadata.outputs.cvss }}
        with:
          script: |
            const { enableAutoMerge } = require(`${process.env.GITHUB_WORKSPACE}/.github/actions/dependabot-auto-merge/enable-auto-merge.js`);
            const payload = JSON.parse(require('node:fs').readFileSync(`${process.env.RUNNER_TEMP}/dependabot-pr-event.json`, 'utf8'));
            await enableAutoMerge({ github, core, context: { repo: context.repo, eventName: 'pull_request', payload }, metadata: {
              updateType: process.env.UPDATE_TYPE, alertState: process.env.ALERT_STATE, cvss: process.env.CVSS,
            } });
