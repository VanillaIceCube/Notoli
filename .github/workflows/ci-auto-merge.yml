name: Dependabot Auto Merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  dependabot-auto-merge:
    name: Dependabot Auto Merge
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: write
      pull-requests: write
      vulnerability-alerts: read
    steps:
      # Privileged code comes only from reviewed main. No PR checkout/artifacts/caches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Resolve successful CI and hold the required per-head policy check
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { resolveRun, trusted, policyContext } = require(`${process.env.GITHUB_WORKSPACE}/.github/actions/dependabot-auto-merge/enable-auto-merge.js`);
            const pr = await resolveRun({ github, context });
            if (!pr) {
              core.info('No current open main PR for this successful CI head.');
              return;
            }
            const { data: check } = await github.rest.checks.create({
              ...context.repo, name: policyContext, head_sha: pr.head.sha,
              status: 'in_progress', external_id: String(context.payload.workflow_run.id),
            });
            core.setOutput('policy_id', check.id);
            core.setOutput('eligible', trusted(pr, `${context.repo.owner}/${context.repo.repo}`));
            require('node:fs').writeFileSync(`${process.env.RUNNER_TEMP}/dependabot-pr-event.json`, JSON.stringify({ pull_request: pr }));

      - name: Install the pinned safe metadata parser
        if: steps.pr.outputs.eligible == 'true'
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Validate this head and enable native protected-branch auto-merge
        id: enable
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          POLICY_CHECK_ID: ${{ steps.pr.outputs.policy_id }}
          OBI_WAN_REVIEWER_LOGIN: ${{ vars.OBI_WAN_REVIEWER_LOGIN || 'obi-wan-code-nobi-reviewer[bot]' }}
          LINT_EASTWOOD_REVIEWER_LOGIN: ${{ vars.LINT_EASTWOOD_REVIEWER_LOGIN || 'lint-eastwood-build-sheriff[bot]' }}
          ROBOCOP_REVIEWER_LOGIN: ${{ vars.ROBOCOP_REVIEWER_LOGIN || 'robocop-security-officer[bot]' }}
        with:
          script: |
            const { enableAutoMerge } = require(`${process.env.GITHUB_WORKSPACE}/.github/actions/dependabot-auto-merge/enable-auto-merge.js`);
            const payload = JSON.parse(require('node:fs').readFileSync(`${process.env.RUNNER_TEMP}/dependabot-pr-event.json`, 'utf8'));
            await enableAutoMerge({ github, core, context: { repo: context.repo, eventName: 'pull_request', payload },
              policyCheckId: Number(process.env.POLICY_CHECK_ID), reviewerLogins: [
                process.env.OBI_WAN_REVIEWER_LOGIN, process.env.LINT_EASTWOOD_REVIEWER_LOGIN, process.env.ROBOCOP_REVIEWER_LOGIN,
              ],
            });

      - name: Complete the per-head policy check
        if: always() && steps.pr.outputs.policy_id != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          POLICY_CHECK_ID: ${{ steps.pr.outputs.policy_id }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.checks.update({ ...context.repo, check_run_id: Number(process.env.POLICY_CHECK_ID),
              status: 'completed', conclusion: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              output: { title: 'Dependabot policy for this exact head', summary: process.env.JOB_STATUS === 'success'
                ? 'Policy passed or automatic merging is inapplicable. GitHub still enforces all branch requirements.'
                : 'Policy validation failed; native auto-merge remains blocked by this required check.' },
            });
