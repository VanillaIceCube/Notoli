name: Dependabot Auto Merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  dependabot-auto-merge:
    uses: VanillaIceCube/infrastructure/.github/workflows/ci-auto-merge.yml@51a48938ab24c11c4fe14a6e8d1becfce9936595 # Infrastructure, 2026-11-27
