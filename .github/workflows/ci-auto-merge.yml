name: Dependabot Auto Merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  dependabot-auto-merge:
    name: Dependabot Auto Merge
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: write
      pull-requests: write
      vulnerability-alerts: read
    steps:
      # Privileged code comes only from reviewed main. No PR checkout/artifacts/caches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Resolve successful CI and hold the required per-head policy check
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/manage-dependabot-auto-merge.js`).startPolicy({ github, context, core });

      - name: Install reviewed automation dependencies
        if: steps.pr.outputs.policy_id != ''
        run: npm ci --prefix .github --ignore-scripts --no-audit --no-fund

      - name: Compare workflow write grants using reviewed main code
        if: steps.pr.outputs.policy_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: node {0}
        run: |
          const { execFileSync } = require('node:child_process');
          const { BASE_SHA, HEAD_SHA, PR_NUMBER } = process.env;
          if (![BASE_SHA, HEAD_SHA].every(sha => /^[a-f0-9]{40}$/.test(sha)) || !/^[1-9][0-9]*$/.test(PR_NUMBER)) {
            throw new Error('Invalid pull request or commit reference');
          }
          // Fetch only Git objects. Proposed files are never checked out.
          execFileSync('git', ['-c', 'credential.helper=', '-c', 'credential.helper=!gh auth git-credential',
            'fetch', '--no-tags', '--depth=1', 'origin', BASE_SHA, 'refs/pull/' + PR_NUMBER + '/head'], { stdio: 'inherit' });
          delete process.env.GH_TOKEN;
          execFileSync(process.execPath, ['.github/scripts/validate-workflows.js', '--compare-workflow-grants',
            BASE_SHA, HEAD_SHA], { stdio: 'inherit' });

      - name: Validate this head and enable native protected-branch auto-merge
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          POLICY_CHECK_ID: ${{ steps.pr.outputs.policy_id }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NODE_ID: ${{ steps.pr.outputs.node_id }}
          OBI_WAN_REVIEWER_LOGIN: ${{ vars.OBI_WAN_REVIEWER_LOGIN || 'obi-wan-code-nobi-reviewer[bot]' }}
          LINT_EASTWOOD_REVIEWER_LOGIN: ${{ vars.LINT_EASTWOOD_REVIEWER_LOGIN || 'lint-eastwood-build-sheriff[bot]' }}
          ROBOCOP_REVIEWER_LOGIN: ${{ vars.ROBOCOP_REVIEWER_LOGIN || 'robocop-security-officer[bot]' }}
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/manage-dependabot-auto-merge.js`).checkAndEnable({ github, context, core });

      - name: Complete the per-head policy check
        if: always() && steps.pr.outputs.policy_id != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          POLICY_CHECK_ID: ${{ steps.pr.outputs.policy_id }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/manage-dependabot-auto-merge.js`).finishPolicy({ github, context });
