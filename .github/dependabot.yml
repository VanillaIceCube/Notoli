version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
      time: "00:00"
      
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "daily"
      time: "00:00"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
    groups:
      codeql:
        applies-to: version-updates
        patterns: ["github/codeql-action", "github/codeql-action/*"]
      codeql-security:
        applies-to: security-updates
        patterns: ["github/codeql-action", "github/codeql-action/*"]

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "daily"
      time: "00:00"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "daily"
      time: "00:00"
