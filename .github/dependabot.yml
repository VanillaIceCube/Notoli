version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/.github"
    schedule:
      interval: "daily"
      time: "00:00"

  - package-ecosystem: "npm"
    directory: "/frontend"
    ignore:
      # ESLint needs the TypeScript 6 compiler API. Recheck at 7.1.
      - dependency-name: "typescript"
        versions: ["7.0.x"]
    schedule:
      interval: "daily"
      time: "00:00"
      
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "daily"
      time: "00:00"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
    groups:
      codeql:
        applies-to: version-updates
        patterns: ["github/codeql-action", "github/codeql-action/*"]
      codeql-security:
        applies-to: security-updates
        patterns: ["github/codeql-action", "github/codeql-action/*"]

  - package-ecosystem: "docker"
    directory: "/backend/docker"
    ignore:
      # Both backend images must match the locked Python 3.12 project.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    schedule:
      interval: "daily"
      time: "00:00"

  - package-ecosystem: "docker"
    directory: "/frontend/docker"
    schedule:
      interval: "daily"
      time: "00:00"
