name: Publish AI Review
description: Publish a native PR review with valid inline placement and duplicate suppression.
inputs:
  github_token:
    description: GitHub App installation token for the reviewer persona.
    required: true
  review_json:
    description: Strict JSON returned by the AI reviewer.
    required: true
  persona_name:
    description: Human-readable reviewer persona name.
    required: true
  require_major_upgrade_brief:
    description: Require a complete major-upgrade brief rather than publishing a partial one.
    required: false
    default: "false"
  app_slug:
    description: Authenticated app-slug output from the same token step.
    required: true
runs:
  using: composite
  steps:
    - name: Publish native review
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        REVIEW_BODY: ${{ inputs.review_json }}
        APP_SLUG: ${{ inputs.app_slug }}
        PERSONA_NAME: ${{ inputs.persona_name }}
        REQUIRE_MAJOR_UPGRADE_BRIEF: ${{ inputs.require_major_upgrade_brief }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const { publishAiReview } = require(
            `${process.env.GITHUB_WORKSPACE}/.github/actions/publish-ai-review/publish-ai-review.js`,
          );

          await publishAiReview({
            github,
            context,
            core,
            raw: process.env.REVIEW_BODY,
            personaName: process.env.PERSONA_NAME,
            appSlug: process.env.APP_SLUG,
            requireMajorUpgradeBrief: process.env.REQUIRE_MAJOR_UPGRADE_BRIEF === "true",
          });
