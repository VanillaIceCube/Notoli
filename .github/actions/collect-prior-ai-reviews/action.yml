name: Collect Prior AI Reviews
description: Write prior native PR reviews for the current GitHub App identity to a context file.
inputs:
  github_token:
    description: GitHub App installation token for the reviewer persona.
    required: true
  persona_name:
    description: Human-readable reviewer persona name.
    required: true
  output_path:
    description: Path where prior-review context should be written.
    required: true
  max_reviews:
    description: Maximum prior reviews to include.
    required: false
    default: "5"
  app_slug:
    description: Authenticated app-slug output from the same create-github-app-token step.
    required: true
runs:
  using: composite
  steps:
    - name: Collect bounded untrusted discussion
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        PERSONA_NAME: ${{ inputs.persona_name }}
        OUTPUT_PATH: ${{ inputs.output_path }}
        MAX_REVIEWS: ${{ inputs.max_reviews }}
        APP_SLUG: ${{ inputs.app_slug }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const { collect } = require(`${process.env.GITHUB_WORKSPACE}/.github/actions/collect-prior-ai-reviews/collect.js`);
          const payload = await collect({ github, context, core, personaName: process.env.PERSONA_NAME,
            appSlug: process.env.APP_SLUG, maxReviews: process.env.MAX_REVIEWS });
          const fs = require('node:fs');
          fs.mkdirSync(require('node:path').dirname(process.env.OUTPUT_PATH), { recursive: true });
          fs.writeFileSync(process.env.OUTPUT_PATH, JSON.stringify(payload));
          core.info(`Prior discussion evidence: ${JSON.stringify({ status: payload.status, head_sha: payload.head_sha,
            own_reviews: payload.prior_reviews.length, human_reviews: payload.human_reviews.length,
            human_replies: payload.replies_to_prior_findings.length, truncated: payload.truncated })}`);
