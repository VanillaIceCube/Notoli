name: Get Prior AI Reviews
description: Write prior native PR reviews for the current GitHub App identity to a context file.
inputs:
  github_token:
    description: GitHub App installation token for the reviewer persona.
    required: true
  persona_name:
    description: Human-readable reviewer persona name.
    required: true
  output_path:
    description: Path where prior-review context should be written.
    required: true
  app_slug:
    description: Authenticated app-slug output from the same create-github-app-token step.
    required: true
runs:
  using: composite
  steps:
    - name: Collect bounded untrusted discussion
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        PERSONA_NAME: ${{ inputs.persona_name }}
        OUTPUT_PATH: ${{ inputs.output_path }}
        APP_SLUG: ${{ inputs.app_slug }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const { writePriorReviewContext } = require(process.env.GITHUB_WORKSPACE + '/.github/actions/get-prior-ai-reviews/get-prior-ai-reviews.js');
          await writePriorReviewContext({
            github, context, core,
            personaName: process.env.PERSONA_NAME,
            appSlug: process.env.APP_SLUG,
            outputPath: process.env.OUTPUT_PATH,
          });
