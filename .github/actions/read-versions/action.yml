name: Read Versions
description: Read Node and Python versions from repo source-of-truth files.
inputs:
  read_node:
    description: "Read Node version from frontend/package.json engines.node"
    required: false
    default: "true"
  read_python:
    description: "Read Python requirement from backend/pyproject.toml project.requires-python"
    required: false
    default: "true"
outputs:
  node_version:
    description: "Node version from frontend/package.json engines.node"
    value: ${{ steps.node.outputs.node_version }}
  python_version:
    description: "Python requirement from backend/pyproject.toml project.requires-python"
    value: ${{ steps.python.outputs.python_version }}
runs:
  using: composite
  steps:
    - name: Read Node version
      id: node
      if: ${{ inputs.read_node == 'true' }}
      shell: bash
      run: |
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        root = Path(os.environ["GITHUB_WORKSPACE"])
        package_path = root / "frontend" / "package.json"
        data = json.loads(package_path.read_text(encoding="utf-8"))
        version = (data.get("engines") or {}).get("node")
        if not isinstance(version, str) or not version.strip() or "\n" in version or "\r" in version:
            raise SystemExit("Missing or invalid engines.node in frontend/package.json")
        version = version.strip()
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
            f.write(f"node_version={version}\n")
        PY

    - name: Read Python version
      id: python
      if: ${{ inputs.read_python == 'true' }}
      shell: bash
      run: |
        python3 - <<'PY'
        import os
        import tomllib
        from pathlib import Path

        root = Path(os.environ["GITHUB_WORKSPACE"])
        project_path = root / "backend" / "pyproject.toml"
        data = tomllib.loads(project_path.read_text(encoding="utf-8"))
        version = data.get("project", {}).get("requires-python")
        if not isinstance(version, str) or not version.strip() or "\n" in version or "\r" in version:
            raise SystemExit("Missing or invalid project.requires-python in backend/pyproject.toml")
        version = version.strip()
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
            f.write(f"python_version={version}\n")
        PY
