name: Set up Python with uv
description: Install the pinned Python toolchain and synchronize the locked project environment.
inputs:
  project-directory:
    description: Directory containing pyproject.toml and uv.lock, relative to the repository root.
    required: false
    default: "backend"
  only-dev:
    description: Install only repository tooling without application dependencies.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version-file: ${{ inputs.project-directory }}/pyproject.toml
    - name: Install uv
      shell: bash
      working-directory: ${{ github.workspace }}
      run: node "$GITHUB_ACTION_PATH/setup-uv.js"
    - name: Synchronize the project environment
      if: inputs.only-dev != 'true'
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.project-directory }}
      run: uv sync --locked
    - name: Synchronize repository tooling only
      if: inputs.only-dev == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.project-directory }}
      run: uv sync --locked --only-group dev
    - name: Expose the synchronized Python environment
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.project-directory }}
      run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
