name: Set up Python with uv
description: Install the pinned Python toolchain and synchronize the locked backend environment.
inputs:
  only-dev:
    description: Install only repository tooling without application dependencies.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version-file: backend/pyproject.toml
    - name: Install uv
      shell: bash
      working-directory: ${{ github.workspace }}
      run: python -m pip install --disable-pip-version-check uv==0.13.8
    - name: Synchronize the backend environment
      if: inputs.only-dev != 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: uv sync --locked --project backend
    - name: Synchronize repository tooling only
      if: inputs.only-dev == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: uv sync --locked --project backend --only-group dev
    - name: Expose the synchronized Python environment
      shell: bash
      working-directory: ${{ github.workspace }}
      run: echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"
