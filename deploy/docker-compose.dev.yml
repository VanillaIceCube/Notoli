name: notoli-dev

services:
  backend:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile.dev
    container_name: notoli-backend-dev
    command: ["uv", "run", "--locked", "uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--reload", "--no-proxy-headers"]
    env_file: ./.env
    environment:
      DJANGO_DEBUG: "1"
      # Stable local sessions; production still requires an explicit private key.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-notoli-development-only-secret-key-keep-production-secrets-out-of-source}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,notoli.localhost
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:${NOTOLI_DEV_FRONTEND_PORT:-3000},http://notoli.localhost:${NOTOLI_DEV_FRONTEND_PORT:-3000}
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:${NOTOLI_DEV_FRONTEND_PORT:-3000},http://notoli.localhost:${NOTOLI_DEV_FRONTEND_PORT:-3000}
      DJANGO_FRONTEND_BASE_URL: http://notoli.localhost:${NOTOLI_DEV_FRONTEND_PORT:-3000}
      DJANGO_MCP_BASE_URL: http://notoli.localhost:${NOTOLI_DEV_BACKEND_PORT:-8000}
      DJANGO_TRUSTED_PROXY_IPS: ""
      DJANGO_SQLITE_PATH: /backend/db.sqlite3
    volumes:
      - ../backend:/backend
      - type: bind
        source: ./db.sqlite3
        target: /backend/db.sqlite3
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${NOTOLI_DEV_BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: docker/Dockerfile.dev
    container_name: notoli-frontend-dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      HOST: 0.0.0.0
      VITE_MCP_ENABLED: ${DJANGO_MCP_ENABLED:-0}
      VITE_API_BASE_URL: http://notoli.localhost:${NOTOLI_DEV_BACKEND_PORT:-8000}
    volumes:
      - ../frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    ports:
      - "127.0.0.1:${NOTOLI_DEV_FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
