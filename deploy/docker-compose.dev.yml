name: notoli-dev

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: notoli-backend-dev
    env_file: ./.env
    environment:
      # This fallback is development-only. Production must set its own secret.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-notoli-development-only-secret-key-keep-production-secrets-out-of-source}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,notoli.localhost
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:${NOTOLI_DEV_FRONTEND_PORT:-3000},http://notoli.localhost:${NOTOLI_DEV_FRONTEND_PORT:-3000}
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:${NOTOLI_DEV_FRONTEND_PORT:-3000},http://notoli.localhost:${NOTOLI_DEV_FRONTEND_PORT:-3000}
      DJANGO_FRONTEND_BASE_URL: http://notoli.localhost:${NOTOLI_DEV_FRONTEND_PORT:-3000}
      DJANGO_SQLITE_PATH: /backend/db.sqlite3
    volumes:
      - ../backend:/backend
      - ./db.sqlite3:/backend/db.sqlite3
    ports:
      - "127.0.0.1:${NOTOLI_DEV_BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: notoli-frontend-dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      HOST: 0.0.0.0
      REACT_APP_API_BASE_URL: http://notoli.localhost:${NOTOLI_DEV_BACKEND_PORT:-8000}
      WATCHPACK_POLLING: "true"
    volumes:
      - ../frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    ports:
      - "127.0.0.1:${NOTOLI_DEV_FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
