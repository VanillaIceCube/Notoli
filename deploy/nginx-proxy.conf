# Standalone local HTTPS template; official Nginx startup expands LOCAL_* only.
map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 80;
  listen [::]:80;
  server_name ${LOCAL_SERVER_NAME};
  return 301 ${LOCAL_HTTPS_ORIGIN}$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ${LOCAL_SERVER_NAME};

  ssl_certificate     /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin.key;
  client_max_body_size 25m;
  absolute_redirect off;

  # This proxy terminates local TLS. Never trust forwarded metadata from clients.
  proxy_redirect off;
  proxy_cache off;
  proxy_read_timeout 120s;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header Forwarded "";
  proxy_set_header Upgrade "";
  proxy_set_header Connection "";

  location = /mcp {
    proxy_pass http://backend:8000;
    proxy_buffering off;
    proxy_request_buffering off;
    add_header Cache-Control "no-store" always;
  }

  location ^~ /.well-known/ {
    proxy_pass http://backend:8000;
    add_header Cache-Control "no-store" always;
  }

  location = /api { return 301 /api/; }
  location ^~ /api/ {
    proxy_pass http://backend:8000;
    add_header Cache-Control "no-store" always;
  }

  location = /auth { return 301 /auth/; }
  location ^~ /auth/ {
    proxy_pass http://backend:8000;
    add_header Cache-Control "no-store" always;
  }

  location = /admin { return 301 /admin/; }
  location ^~ /admin/ {
    proxy_pass http://backend:8000;
    add_header Cache-Control "no-store" always;
  }

  location ^~ /static/admin/ {
    proxy_pass http://backend:8000;
  }

  location ^~ /static/rest_framework/ {
    proxy_pass http://backend:8000;
  }

  # Frontend SPA and authentication/approval deep links.
  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
